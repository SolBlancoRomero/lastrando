<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lastrando - Grupo 3</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: #F6F4F1;
      color: #1A1A1A;
      text-align: center;
    }

    header {
      padding: 15px;
      border-bottom: 1px solid #C9C1B4;
    }

    main {
      padding: 40px 20px;
    }

    .logo {
      width: 250px;
      max-width: 80%;
    }

    .proximamente {
      background-color: #F6DFCD;
      padding: 20px;
      margin: 30px auto;
      max-width: 450px;
      border-radius: 10px;
    }

    .integrantes {
      background-color: #FFFFFF;
      border: 1px solid #C9C1B4;
      padding: 20px;
      margin: 0 auto;
      max-width: 450px;
      border-radius: 10px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      padding: 8px;
    }

    footer {
      padding: 15px;
      font-size: 14px;
      border-top: 1px solid #C9C1B4;
    }

    @media (min-width: 768px) {
      .logo {
        width: 320px;
      }
    }
  </style>
</head>
<body>

  <header>
    <p>Actividad 2 - Grupo N° 3</p>
  </header>

  <main>
    <img class="logo" src="logo.png" alt="Logo de Lastrando">

    <div class="proximamente">
      <p>Próximamente</p>
      <h1>Lastrando</h1>
    </div>

    <div class="integrantes">
      <h2>Integrantes</h2>
      <ul>
        <li>Sol Blanco</li>
        <li>Isabella Cuccaro</li>
        <li>Celina Daiub</li>
        <li>Leonela Juarez</li>
        <li>Camila Repond</li>
      </ul>
    </div>
  </main>

  <footer>
    <p>Lastrando - Grupo 3</p>
  </footer>

</body>
</html>
